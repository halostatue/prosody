StylesPath = .config/styles
MinAlertLevel = suggestion
Vocab = Prosody
Grammars = elixir, yaml

[formats]
# Comments are Markdown.
ex = md
exs = md
yml = md
yaml = md

# Markdown.
[*.md]
BasedOnStyles = Vale

# Comments in Elixir sources.
[*.{ex,exs}]
BasedOnStyles = Vale

[.github/workflows/*.{yml,yaml}]
BasedOnStyles = Vale
View = GHA
